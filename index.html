<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>煎蛋侠w | 个人博客</title>
    <meta name="description" content="一个像素风个人博客，记录文章、音乐与日常想法。" />
    <link rel="stylesheet" href="styles.css?v=desktop-video-bg-fullbleed-20260608" />
  </head>
  <body>
    <div class="pixel-noise" aria-hidden="true"></div>
    <nav class="social-dock" aria-label="社交链接">
      <a href="https://space.bilibili.com/476263980" target="_blank" rel="noopener noreferrer" aria-label="打开 Bilibili 主页">
        <img src="assets/icons/bilibili.png" alt="" />
      </a>
      <a href="https://www.douyin.com/user/self" target="_blank" rel="noopener noreferrer" aria-label="打开抖音主页">
        <img src="assets/icons/douyin.png" alt="" />
      </a>
    </nav>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="回到首页">
        <span class="brand-mark">B</span>
        <span>煎蛋侠w</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="index.html#articles">文章</a>
        <a href="topics.html">专题</a>
        <a href="contact.html">联系</a>
        <button class="theme-toggle" type="button" aria-label="切换到日间主题">
          <img src="assets/icons/theme-star.png" alt="" />
        </button>
      </nav>
    </header>

    <section class="music-player" id="player" aria-label="像素播放器">
      <div class="record-badge" aria-hidden="true">
        <img src="assets/icons/record.png" alt="" />
      </div>
      <div class="track-screen">
        <span class="track-label">NOW PLAYING</span>
        <strong id="trackName">8-bit 《稻香》</strong>
        <span id="playerStatus">READY</span>
      </div>
      <div class="player-controls">
        <button class="player-button" type="button" data-action="prev" aria-label="上一首">◂◂</button>
        <button class="player-button is-primary" type="button" data-action="toggle" aria-label="播放或暂停">▶</button>
        <button class="player-button" type="button" data-action="next" aria-label="下一首">▸▸</button>
      </div>
      <label class="volume-control">
        <span>VOL</span>
        <input id="volumeControl" type="range" min="0" max="100" value="42" />
      </label>
    </section>

    <main id="top">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">LATEST POSTS · AUTO SCROLL</p>
          <h1>最近写的文章</h1>
          <div class="post-marquee" aria-label="最近写的文章">
            <div class="marquee-track" id="latestPostsMarquee"></div>
          </div>
          <div class="hero-actions">
            <a class="button primary" href="#articles">查看文章</a>
          </div>
        </div>

        <aside class="status-window" aria-label="博客状态">
          <div class="window-title">SAVE FILE</div>
          <dl>
            <div>
              <dt>ARTICLES</dt>
              <dd id="articleCount">0</dd>
            </div>
            <div>
              <dt>TOPICS</dt>
              <dd>4</dd>
            </div>
            <div>
              <dt>STATUS</dt>
              <dd>ONLINE</dd>
            </div>
          </dl>
        </aside>
      </section>

      <section class="section" id="articles">
        <div class="section-heading">
          <div>
            <p class="eyebrow">ARTICLE INDEX</p>
            <h2>文章列表</h2>
          </div>
          <form class="search-box" role="search">
            <label class="sr-only" for="postSearch">搜索文章</label>
            <input
              id="postSearch"
              name="q"
              type="search"
              autocomplete="off"
              placeholder="搜索标题、分类、摘要..."
            />
            <span class="search-caret" aria-hidden="true">▸</span>
          </form>
        </div>
        <p class="result-count" id="resultCount" aria-live="polite"></p>
        <div class="article-grid" id="articleGrid"></div>
        <p class="empty-state" id="emptyState" hidden>没有找到匹配文章，换个关键词试试。</p>
      </section>

    </main>

    <footer class="site-footer">
      <span>© 2026 煎蛋侠w</span>
      <span>INSERT COIN TO CONTINUE</span>
    </footer>

    <script src="script.js?v=desktop-video-bg-visible-20260608"></script>
  </body>
</html>
