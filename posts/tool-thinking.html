          <h1>好工具为什么总是让人少想一步</h1>
          <div class="article-meta"><span>产品观察</span><time datetime="2026-05-24">2026.05.24</time></div>
        </header>
        <div class="article-body">
          <p>这是一篇文章页示例。真正的产品观察可以从一个小交互开始：默认值、提示语、反馈时机，都会影响用户是否轻松。</p>
          <h2>默认值是一种设计态度</h2>
          <p>好的默认值让用户不用在每一步都重新判断。它不替用户做决定，但会把最常见、最稳妥的路径先摆在眼前。</p>
          <h2>反馈要及时，也要克制</h2>
          <p>用户完成动作后，系统应该给出可感知的回应。回应不需要夸张，只要让人知道事情已经发生，下一步该往哪走。</p>
