          <h1>周末城市漫游：把路线留给直觉</h1>
          <div class="article-meta"><span>生活记录</span><time datetime="2026-04-12">2026.04.12</time></div>
        </header>
        <div class="article-body">
          <p>这是一篇文章页示例。有时候不做计划，反而会更容易看见城市的纹理。</p>
          <h2>从一条小路开始</h2>
          <p>散步最好的部分，是允许自己偏离原本的路线。一个招牌、一段树影、一家临街小店，都可能成为新的方向。</p>
          <h2>慢下来才有细节</h2>
          <p>当脚步慢下来，很多平时擦肩而过的东西会突然变清楚。城市像一张像素地图，靠近后才看见格子里的内容。</p>
